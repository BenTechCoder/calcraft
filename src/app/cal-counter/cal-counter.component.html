<section class="center region">
  <div class="region">
    <mat-slide-toggle [(ngModel)]="proteinActivated"></mat-slide-toggle>
  </div>
  <form class="cluster" [formGroup]="calorieForm" (ngSubmit)="onSubmit()">
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput type="text" #nameInput formControlName="name" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Calories</mat-label>
      <input matInput type="number" formControlName="calories" #calorieInput />
    </mat-form-field>
    @if (proteinActivated) {
      <mat-form-field>
        <mat-label>Protein</mat-label>
        <input matInput type="number" formControlName="protein" #calorieInput />
      </mat-form-field>
    }
    <button mat-fab color="accent" type="submit">
      <mat-icon>addition</mat-icon>
    </button>
    <button mat-raised-button (click)="clearAllItems()" type="button">
      <strong>Clear All</strong>
    </button>
  </form>

  <div class="region">
    <mat-list>
      @for(item of calItems; track item) {
      <app-calitem [item]="item"></app-calitem>
      }
    </mat-list>
  </div>
</section>
